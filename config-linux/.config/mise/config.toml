[tools]
"aqua:atlassian.com/acli" = "latest"
"aqua:CircleCI-Public/circleci-cli" = "latest"
"aqua:EmbarkStudios/cargo-deny" = "latest"
"aqua:max-sixty/worktrunk" = "latest"
# rustsec/rustsec is a monorepo; cargo-audit releases are tagged cargo-audit/vX.Y.Z.
"github:rustsec/rustsec" = { version = "latest", version_prefix = "cargo-audit/v", bin = "cargo-audit" }
"npm:@herb-tools/language-server" = "latest"
"npm:@tobilu/qmd" = "latest"
ruby = "4.0.9"

[settings]
lockfile = true
# Only install releases that have been public for a week, so a hijacked
# package is usually caught and pulled before it reaches this machine.
minimum_release_age = "7d"
# Agent CLIs from Omarchy's /etc/mise/conf.d/omarchy-tools.toml that I don't use.
disable_tools = [
  "antigravity-cli",
  "copilot",
  "cursor-agent",
  "grok",
  "http:devin",
  "http:kiro-cli",
  "npm:@deepseek-ai/dsh",
  "ori",
  "qwen",
]

[settings.upgrade]
auto_prune = true
