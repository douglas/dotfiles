# Key logins only, on every Linux machine (dotlayer system_files), whether
# sshd was started by ssh-mode, the SSH hub or anything else. sshd keeps the
# first value it reads, and 05 sorts before the other drop-ins.
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin no
MaxAuthTries 3
