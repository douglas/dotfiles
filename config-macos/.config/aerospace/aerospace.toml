# AeroSpace config — Omarchy-style tiling for macOS (⌥ Option = Super; ⌘ stays macOS)
# Reload with: aerospace reload-config
#
# Based on omarchy4mac's aerospace/aerospace.toml (MIT, (c) 2026 dividendsolo,
# https://github.com/dividendsolo/omarchy4mac at 0cdf09d). The bar, borders,
# Hammerspoon menus and the $HOME/.local/bin helpers it calls come from the
# ~/src/omarchy4mac checkout, linked by Install/macOS/install.sh desktop.
# To take upstream changes: diff this file against the checkout's copy.

# Lifecycle (startup + relaunch-on-crash) is owned by the launchd watchdog:
# ~/Library/LaunchAgents/com.omarchy-mac.aerospace-keepalive.plist
start-at-login = false

# Super+L saves each workspace's layout (tiles, accordion, floating); put it
# back whenever AeroSpace starts (bin/omarchy-workspace-layout, omarchy4mac#23).
after-startup-command = ['exec-and-forget $HOME/.local/bin/omarchy-workspace-layout restore']

# config-version 2 stops guessing persistent workspaces from the key bindings,
# so the five bound workspaces are listed here (omarchy4mac#19).
config-version = 2
persistent-workspaces = ['1', '2', '3', '4', '5']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Tiles, like Omarchy 4's default (dwindle): new windows open side by side.
# alt-a toggles a workspace to accordion (focused window full width, others
# collapse to edge strips). Cycle windows with cmd-alt-backtick.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = [
  'move-mouse monitor-lazy-center',
  'exec-and-forget /bin/bash -c "/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$(/opt/homebrew/bin/aerospace list-workspaces --focused)"'
]
on-focus-changed = ['move-mouse window-lazy-center']

# Notify SketchyBar when workspace focus changes
exec-on-workspace-change = ['/bin/bash', '-c',
  '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE']

# omarchy4mac pins workspaces to its author's VA2446 monitors; that block is
# left out, so workspaces follow whichever monitor they were opened on.
# Omarchy's gaps: gaps_in = 5 on each window (10 between two), gaps_out = 10.
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 42   # 32 (SketchyBar height) + 10
outer.right = 10

[mode.main.binding]
# ⌘ stays exactly as macOS has it (text navigation, tabs, quitting apps), and
# the window manager lives on ⌥ Option, where Super sits on the desktop's
# keyboard. Accent keys stay free for typing (⌥C ç, ⌥E ´, ⌥U ¨, ⌥I ˆ, ⌥N ˜, ⌥`).
# Hammerspoon adds ⌥K (this list), ⌘⇧Space (Omarchy menu), ⌘⌃⇧Space (themes).

# ---------- Windows ----------
alt-w = 'close'                         # Super+W: close the window, not the app
alt-f = 'fullscreen'                    # Super+F
alt-s = 'layout floating tiling'        # Super+T-ish: float / tile
alt-j = 'layout tiles horizontal vertical'   # Super+J: toggle split
alt-a = 'layout accordion tiles'
alt-m = 'macos-native-minimize'
alt-equal = 'resize smart +50'
alt-minus = 'resize smart -50'

# ---------- Focus and move (⌃⌥ + arrows; plain ⌥←/→ stays word navigation) ----------
ctrl-alt-left = 'focus --boundaries all-monitors-outer-frame left'
ctrl-alt-right = 'focus --boundaries all-monitors-outer-frame right'
ctrl-alt-up = 'focus --boundaries all-monitors-outer-frame up'
ctrl-alt-down = 'focus --boundaries all-monitors-outer-frame down'
ctrl-alt-shift-left = 'move left'
ctrl-alt-shift-right = 'move right'
ctrl-alt-shift-up = 'move up'
ctrl-alt-shift-down = 'move down'
alt-tab = 'workspace --wrap-around next'
alt-shift-tab = 'workspace --wrap-around prev'
ctrl-alt-tab = 'focus-monitor --wrap-around next'
alt-shift-comma = 'move-workspace-to-monitor --wrap-around prev'
alt-shift-period = 'move-workspace-to-monitor --wrap-around next'

# ---------- Workspaces (per monitor, bin/omarchy-workspace) ----------
alt-1 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace 1'
alt-2 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace 2'
alt-3 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace 3'
alt-4 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace 4'
alt-5 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace 5'
alt-6 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace 6'
alt-7 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace 7'
alt-8 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace 8'
alt-9 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace 9'
alt-shift-1 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move-follow 1'
alt-shift-2 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move-follow 2'
alt-shift-3 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move-follow 3'
alt-shift-4 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move-follow 4'
alt-shift-5 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move-follow 5'
alt-shift-6 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move-follow 6'
alt-shift-7 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move-follow 7'
alt-shift-8 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move-follow 8'
alt-shift-9 = 'exec-and-forget $HOME/.local/bin/omarchy-workspace --move-follow 9'

# ---------- Launch (Omarchy's Super+Return, Super+Shift+B, F, N, T) ----------
alt-enter = 'exec-and-forget $HOME/.local/bin/omarchy-terminal'
alt-shift-b = 'exec-and-forget $HOME/.local/bin/omarchy-launch-browser'
alt-shift-f = 'exec-and-forget open -a Finder'
alt-shift-n = 'exec-and-forget open -na Ghostty --args -e nvim'
alt-shift-t = 'exec-and-forget open -na Ghostty --args -e btop'
alt-shift-d = 'exec-and-forget open -na Ghostty --args -e lazydocker'

# ---------- Modes ----------
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
cmd-shift-left = ['join-with left', 'mode main']
cmd-shift-down = ['join-with down', 'mode main']
cmd-shift-up = ['join-with up', 'mode main']
cmd-shift-right = ['join-with right', 'mode main']

# Float rules: every app whose windows open floating. A workspace in floating
# mode (alt-l) never claims these, so they stay floating when it ends.
#   System Settings    com.apple.systempreferences
#   Finder             com.apple.finder
#   1Password 8 and 7  com.1password.1password, com.agilebits.onepassword7
#   Bitwarden          com.bitwarden.desktop
#   Raycast            com.raycast.macos
#   Activity Monitor   com.apple.ActivityMonitor
#   Calculator         com.apple.calculator
#   Preview            com.apple.Preview
#   VLC                org.videolan.vlc
#   Steam              com.valvesoftware.steam
#   LocalSend          org.localsend.localsendApp
#   Picture in Picture (any app, by window title)
#   The screensaver    com.mitchellh.ghostty, title org.omarchy.screensaver

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

# Password managers float, like Omarchy's 1password.lua (omacom/omarchy#11704)
# and bitwarden.lua.
[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.agilebits.onepassword7'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

# ---------- Floats ported from Omarchy ----------
# Omarchy floats these in default/hypr/apps/{system,steam,localsend,pip}.conf.
# It also centers them and sizes them 875x600; AeroSpace can't do either for a
# floating window, so a float dragged to the top of the screen can still end up
# behind SketchyBar. Low risk in practice (nobody maximizes Calculator), and
# alt-s tiles the focused window if one ever does get stranded.

# Omarchy: `float on, match:class org.gnome.Calculator`
[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

# Omarchy floats its document/media viewers (org.gnome.Evince, imv, mpv);
# Preview and VLC are the local equivalents.
[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.videolan.vlc'
run = ['layout floating', 'move-node-to-workspace 5']

# Omarchy: `float on, match:class steam`
[[on-window-detected]]
if.app-id = 'com.valvesoftware.steam'
run = 'layout floating'

# Omarchy: `float on, match:class (Share|localsend)`
[[on-window-detected]]
if.app-id = 'org.localsend.localsendApp'
run = 'layout floating'

# Omarchy: `float on, match:tag pip` (title-matched, since PiP is a browser
# window rather than an app of its own).
[[on-window-detected]]
if.window-title-regex-substring = 'Picture.in.Picture'
run = 'layout floating'

# ---------- Workspace per kind of app (not in Omarchy 4) ----------
# Omarchy sends no app to a fixed workspace. Here a new window goes to the
# workspace for its kind: 1 browsers, 2 terminals, 3 AI apps and code editors,
# 4 messaging, 5 media. An app not listed opens where you are. The first rule
# that matches a window wins, so the screensaver rule further down must stay
# above the Ghostty rule, and VLC's float rule above moves it as well.
# Web apps opened with `--app=` are Brave windows, so their keys pass
# --workspace to omarchy-launch-browser instead.

# Browsers are pinned to tiling, mirroring Omarchy's own rule
# (default/hypr/apps/browser.lua: `o.window({ tag = "chromium-based-browser" },
# { tile = true })`). Gaps only apply to tiled windows, and the macOS menu bar
# is auto-hidden, so a floating browser is free to sit at y=0 with its tab
# strip and window controls stranded behind SketchyBar.
[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = ['layout tiling', 'move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['layout tiling', 'move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.duckduckgo.macos.browser'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
if.window-title-regex-substring = 'org.omarchy.screensaver'
run = 'layout floating'

# Workspace per kind of app, continued (see the browsers above). After the
# screensaver rule, so its Ghostty window floats where it is.

# 2: terminals
#
# Not Ghostty: macOS reports each of its native tabs as a window, so moving
# "new windows" to 2 also moves new tabs, and the tab group shrinks. Ghostty
# stays tiled where it opens instead, as Ghostty's docs recommend
# (https://ghostty.org/docs/help/macos-tiling-wms).

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'layout tiling'

[[on-window-detected]]
if.app-id = 'com.termius-dmg.mac'
run = 'move-node-to-workspace 2'

