# Sheprd settings, ported from herdr-app (settings.json and keys.json).
# Sheprd also saves its own Settings choices here, through the symlink.
# herdr-app's "omarchy" theme on macOS is Catppuccin Mocha's palette.

focus_follows_mouse = true
theme = "Catppuccin Mocha"

[terminal]
family = "CommitMono Nerd Font"
size = 13

# herdr-app names: space = workspace, tab = tab, pane = pane.
# The "ctrl-k" chords use Herdr's prefix, set to ctrl+k in config.toml,
# and are written here as "prefix-KEY".
[keybindings]
focus_workspace_1 = ["alt-1", "prefix-1", "prefix-ctrl-1"]
focus_workspace_2 = ["alt-2", "prefix-2", "prefix-ctrl-2"]
focus_workspace_3 = ["alt-3", "prefix-3", "prefix-ctrl-3"]
focus_workspace_4 = ["alt-4", "prefix-4", "prefix-ctrl-4"]
focus_workspace_5 = ["alt-5", "prefix-5", "prefix-ctrl-5"]
focus_workspace_6 = ["alt-6", "prefix-6", "prefix-ctrl-6"]
focus_workspace_7 = ["alt-7", "prefix-7", "prefix-ctrl-7"]
focus_workspace_8 = ["alt-8", "prefix-8", "prefix-ctrl-8"]
focus_workspace_9 = ["alt-9", "prefix-9", "prefix-ctrl-9"]
focus_tab_1 = ["cmd-1", "ctrl-1", "ctrl-alt-1"]
focus_tab_2 = ["cmd-2", "ctrl-2", "ctrl-alt-2"]
focus_tab_3 = ["cmd-3", "ctrl-3", "ctrl-alt-3"]
focus_tab_4 = ["cmd-4", "ctrl-4", "ctrl-alt-4"]
focus_tab_5 = ["cmd-5", "ctrl-5", "ctrl-alt-5"]
focus_tab_6 = ["cmd-6", "ctrl-6", "ctrl-alt-6"]
focus_tab_7 = ["cmd-7", "ctrl-7", "ctrl-alt-7"]
focus_tab_8 = ["cmd-8", "ctrl-8", "ctrl-alt-8"]
focus_tab_9 = ["cmd-9", "ctrl-9", "ctrl-alt-9"]
focus_left = ["cmd-alt-left", "alt-h", "alt-left", "ctrl-alt-left", "prefix-h", "prefix-left"]
focus_down = ["cmd-alt-down", "alt-j", "ctrl-alt-down", "prefix-j", "prefix-down"]
focus_up = ["cmd-alt-up", "alt-k", "ctrl-alt-up", "prefix-k", "prefix-up"]
focus_right = ["cmd-alt-right", "alt-l", "alt-right", "ctrl-alt-right", "prefix-l", "prefix-right"]
swap_pane_left = ["cmd-alt-shift-left", "alt-shift-h"]
swap_pane_down = ["cmd-alt-shift-down", "alt-shift-j"]
swap_pane_up = ["cmd-alt-shift-up", "alt-shift-k"]
swap_pane_right = ["cmd-alt-shift-right", "alt-shift-l"]
increase_font_size = ["cmd-=", "cmd-+", "ctrl-=", "ctrl-+"]
decrease_font_size = ["cmd--", "ctrl--"]
reset_font_size = ["cmd-0", "ctrl-0"]
next_tab = ["cmd-shift-]", "ctrl-tab", "ctrl-pagedown", "alt-]", "ctrl-shift-right", "prefix-n"]
previous_tab = ["cmd-shift-[", "ctrl-shift-tab", "ctrl-pageup", "alt-[", "ctrl-shift-left", "prefix-p"]
next_workspace = ["cmd-alt-]", "ctrl-cmd-down", "ctrl-shift-pagedown", "prefix-)"]
previous_workspace = ["cmd-alt-[", "ctrl-cmd-up", "ctrl-shift-pageup", "prefix-("]
next_agent = ["cmd-]", "alt-down"]
previous_agent = ["cmd-[", "alt-up"]
keybindings = ["cmd-/", "ctrl-?", "ctrl-shift-/"]
toggle_sidebar = ["cmd-b", "ctrl-shift-b"]
new_workspace = ["cmd-n", "ctrl-shift-n"]
new_tab = ["cmd-t", "ctrl-shift-t", "prefix-c"]
workspace_picker = ["cmd-p", "cmd-k", "ctrl-shift-k"]
command_palette = ["cmd-shift-p", "ctrl-shift-p"]
settings = ["cmd-,", "ctrl-,"]
split_right = ["cmd-d", "ctrl-shift-o", "prefix-|", "prefix-shift-right"]
split_down = ["cmd-shift-d", "ctrl-shift-e", "prefix--", "prefix-shift-down"]
close_tab = ["cmd-w", "ctrl-shift-w", "prefix-&"]
close_pane = ["cmd-shift-w", "ctrl-shift-x", "prefix-x"]
toggle_zoom = ["cmd-shift-enter", "ctrl-shift-z", "prefix-z"]
rename_tab = ["f2", "prefix-,"]
rename_workspace = ["shift-f2", "prefix-$"]
review_changes = "prefix-g"
open_notification_target = ["prefix-a", "prefix-ctrl-a"]

[pane_keys]
"alt-backspace" = "ctrl-w"
"ctrl-backspace" = "ctrl-w"
"ctrl-left" = "alt-b"
"ctrl-right" = "alt-f"
"shift-enter" = "alt-enter"
