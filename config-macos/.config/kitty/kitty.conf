# The current Omarchy theme, as on Linux (omarchy-theme-pull copies it here).
include ~/.local/state/omarchy/current/theme/kitty.conf

# Font. macOS counts a point as one screen pixel, so this matches Ghostty's 18.
font_family CommitMono Nerd Font
bold_italic_font auto
font_size 18

# Window
window_padding_width 14
macos_titlebar_color background
hide_window_decorations titlebar-only
confirm_os_window_close 0
# Left Option is Alt, so the shared Alt keybinds (Alt+H/J/K/L, Alt+[ ]) work.
macos_option_as_alt left

# Keybinds shared with Linux (config package), mirroring herdr-app.
include keys.conf

# Cmd keys, as herdr-app has them on macOS (Cmd is where Linux uses F18 via xremap).
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+f search_scrollback
# Line editing, like Linux Cmd+A/E/Backspace and herdr-app Cmd+Left/Right
map cmd+a send_text all \x01
map cmd+e send_text all \x05
map cmd+left send_text all \x01
map cmd+right send_text all \x05
map cmd+backspace send_text all \x15
map alt+backspace send_text all \x17
# Cmd+Enter goes to the app as Ctrl+Enter, as on Linux
map cmd+enter send_key ctrl+enter
# App
map cmd+equal change_font_size all +1.0
map cmd+plus  change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0     change_font_size all 0
map cmd+comma edit_config_file
map cmd+shift+p command_palette
# Windows (herdr spaces)
map cmd+n new_os_window
# Tabs
map cmd+t new_tab
map cmd+w close_tab
map cmd+shift+[ previous_tab
map cmd+shift+] next_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
# Splits (herdr panes)
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+shift+w close_window
map cmd+shift+enter toggle_layout stack
map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down
map cmd+alt+shift+left  move_window left
map cmd+alt+shift+right move_window right
map cmd+alt+shift+up    move_window up
map cmd+alt+shift+down  move_window down

# Allow remote access
allow_remote_control yes

# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Tab bar
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
