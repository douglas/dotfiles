# Rio on macOS: the Linux keybinds (config-omarchy/.config/rio/config.toml)
# plus Cmd keys, as herdr-app has them. Rio can't include files, so the
# shared part is a copy: keep both in sync.
# Defaults already match herdr-app for Cmd+T/N/C/V/F, Cmd+1-9, Cmd+Plus/Minus/0
# and Cmd+Comma.

# Colors follow the Omarchy theme: themes/omarchy.toml links to the file
# omarchy-theme-pull copies from the Linux desktop.
theme = "omarchy"
padding-x = 14
padding-y = [14, 14]
confirm-before-quit = false
# Left Option is Alt, so the Alt keybinds (Alt+H/J/K/L, Alt+[ ]) work.
option-as-alt = "left"

[cursor]
shape = "block"
blinking = false

# Rio counts screen pixels: Linux's 13 matches herdr-app at zoom 1; this
# matches herdr-app at zoom 1.2 and Ghostty's 16.
[fonts]
family = "CommitMono Nerd Font"
size = 16

[bindings]
keys = [
  # Text sent to the shell (herdr "terminal" section)
  { key = "insert", with = "shift", action = "Paste" },
  { key = "insert", with = "control", action = "Copy" },
  { key = "enter", with = "shift", esc = "\u001b\r" },
  { key = "enter", with = "alt | shift", esc = "\u001b[13;4u" },
  { key = "back", with = "control", esc = "\u0017" },
  { key = "left", with = "control", esc = "\u001bb" },
  { key = "right", with = "control", esc = "\u001bf" },
  # App
  { key = "=", with = "control", action = "IncreaseFontSize" },
  { key = "p", with = "control | shift", action = "OpenCommandPalette" },
  # Tabs
  { key = "w", with = "control | shift", action = "CloseTab" },
  { key = "tab", with = "control", action = "SelectNextTab" },
  { key = "tab", with = "control | shift", action = "SelectPrevTab" },
  { key = "pagedown", with = "control", action = "SelectNextTab" },
  { key = "pageup", with = "control", action = "SelectPrevTab" },
  { key = "]", with = "alt", action = "SelectNextTab" },
  { key = "[", with = "alt", action = "SelectPrevTab" },
  { key = "1", with = "control | alt", action = "SelectTab(0)" },
  { key = "2", with = "control | alt", action = "SelectTab(1)" },
  { key = "3", with = "control | alt", action = "SelectTab(2)" },
  { key = "4", with = "control | alt", action = "SelectTab(3)" },
  { key = "5", with = "control | alt", action = "SelectTab(4)" },
  { key = "6", with = "control | alt", action = "SelectTab(5)" },
  { key = "7", with = "control | alt", action = "SelectTab(6)" },
  { key = "8", with = "control | alt", action = "SelectTab(7)" },
  { key = "9", with = "control | alt", action = "SelectTab(8)" },
  # Splits (herdr panes). Rio only cycles splits, so directions map to next/previous.
  { key = "o", with = "control | shift", action = "SplitRight" },
  { key = "e", with = "control | shift", action = "SplitDown" },
  { key = "x", with = "control | shift", action = "CloseSplitOrTab" },
  { key = "h", with = "alt", action = "SelectPrevSplit" },
  { key = "k", with = "alt", action = "SelectPrevSplit" },
  { key = "j", with = "alt", action = "SelectNextSplit" },
  { key = "l", with = "alt", action = "SelectNextSplit" },
  { key = "left", with = "alt", action = "SelectPrevSplit" },
  { key = "right", with = "alt", action = "SelectNextSplit" },
  { key = "left", with = "control | alt", action = "SelectPrevSplit" },
  { key = "up", with = "control | alt", action = "SelectPrevSplit" },
  { key = "right", with = "control | alt", action = "SelectNextSplit" },
  { key = "down", with = "control | alt", action = "SelectNextSplit" },
  # Cmd keys, as herdr-app has them on macOS (Cmd is where Linux uses F18 via xremap)
  { key = "a", with = "super", esc = "\u0001" },
  { key = "e", with = "super", esc = "\u0005" },
  { key = "left", with = "super", esc = "\u0001" },
  { key = "right", with = "super", esc = "\u0005" },
  { key = "back", with = "super", esc = "\u0015" },
  { key = "back", with = "alt", esc = "\u0017" },
  { key = "=", with = "super", action = "IncreaseFontSize" },
  { key = "p", with = "super | shift", action = "OpenCommandPalette" },
  { key = "w", with = "super", action = "CloseTab" },
  { key = "w", with = "super | shift", action = "CloseSplitOrTab" },
  { key = "[", with = "super | shift", action = "SelectPrevTab" },
  { key = "]", with = "super | shift", action = "SelectNextTab" },
  { key = "d", with = "super", action = "SplitRight" },
  { key = "d", with = "super | shift", action = "SplitDown" },
  { key = "left", with = "super | alt", action = "SelectPrevSplit" },
  { key = "up", with = "super | alt", action = "SelectPrevSplit" },
  { key = "right", with = "super | alt", action = "SelectNextSplit" },
  { key = "down", with = "super | alt", action = "SelectNextSplit" },
]
