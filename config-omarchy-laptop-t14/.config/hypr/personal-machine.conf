# ThinkPad T14 laptop personal Hyprland overrides.

plugin {
  hyprtasking {
    debug:trace = 0
    gestures:enabled = 1
    gestures:open_fingers = 4
    gestures:move_fingers = 3
    gestures:open_positive = 1  # swipe up = open, swipe down = close

    grid {
      rows = 3
      cols = 3
    }
  }
}
