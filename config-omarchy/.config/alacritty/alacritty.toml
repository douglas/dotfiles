general.import = [
  "~/.local/state/omarchy/current/theme/alacritty.toml",
  "~/.config/alacritty/machine.toml",
]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "CommitMono Nerd Font" }
bold = { family = "CommitMono Nerd Font" }
italic = { family = "CommitMono Nerd Font" }

# Copy selected text to the clipboard, like herdr-app.
[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "Never" }

[window]
padding.x = 14
padding.y = 14
decorations = "None"

# Keybindings, mirroring ~/.config/herdr-app/keys.json where Alacritty can.
# Alacritty has no tabs, splits or key chords on Linux, so only text, clipboard,
# font size, search and new-window bindings carry over.
[keyboard]
bindings = [
  { key = "Insert", mods = "Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" },
  { key = "Return", mods = "Super", action = "ToggleFullscreen" },
  { key = "Return", mods = "Shift", chars = "\u001B\r" },
  { key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" },
  { key = "Back", mods = "Control", chars = "\u0017" },
  { key = "Left", mods = "Control", chars = "\u001Bb" },
  { key = "Right", mods = "Control", chars = "\u001Bf" },
  { key = "Equals", mods = "Control", action = "IncreaseFontSize" },
  { key = "F", mods = "Control|Shift", action = "SearchForward" },
  { key = "N", mods = "Control|Shift", action = "CreateNewWindow" },
]
