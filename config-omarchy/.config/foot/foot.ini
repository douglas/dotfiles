[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
# Keep foot visually aligned with Ghostty's desktop profile.
font=CommitMono Nerd Font:size=10
pad=14x14
initial-window-size-chars=186x62
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Match Ghostty: Shift+Return sends ESC followed by carriage return.
\x1b\x0d=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
