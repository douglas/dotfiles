[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=CommitMono Nerd Font:size=10
pad=14x14
initial-window-mode=windowed
workers=0
# Per-machine font size and window size, matching ghostty/machine.
include=~/.config/foot/machine.ini

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
# Match herdr-app: Ctrl+Shift+F searches (foot's default Ctrl+Shift+R still works).
search-start=Control+Shift+r Control+Shift+f
spawn-terminal=Control+Shift+n

[text-bindings]
# Match Ghostty: Shift+Return sends ESC followed by carriage return.
\x1b\x0d=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
# Match herdr-app: Ctrl+Backspace deletes a word, Ctrl+Left/Right move by word.
\x17=Control+BackSpace
\x1bb=Control+Left
\x1bf=Control+Right
