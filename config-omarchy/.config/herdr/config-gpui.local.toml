# Sheprd settings, ported from herdr-app (settings.json and keys.json).
# Sheprd also saves its own Settings choices here, through the symlink.
# The theme is left unset: on Omarchy, Sheprd follows the Omarchy theme.

focus_follows_mouse = true

[terminal]
family = "CommitMono Nerd Font"
size = 13

# herdr-app names: space = workspace, tab = tab, pane = pane.
# The "ctrl-k" chords use Herdr's prefix, set to ctrl+k in config.toml,
# and are written here as "prefix-KEY".
[keybindings]
focus_workspace_1 = ["alt-1", "prefix-1", "prefix-ctrl-1"]
focus_workspace_2 = ["alt-2", "prefix-2", "prefix-ctrl-2"]
focus_workspace_3 = ["alt-3", "prefix-3", "prefix-ctrl-3"]
focus_workspace_4 = ["alt-4", "prefix-4", "prefix-ctrl-4"]
focus_workspace_5 = ["alt-5", "prefix-5", "prefix-ctrl-5"]
focus_workspace_6 = ["alt-6", "prefix-6", "prefix-ctrl-6"]
focus_workspace_7 = ["alt-7", "prefix-7", "prefix-ctrl-7"]
focus_workspace_8 = ["alt-8", "prefix-8", "prefix-ctrl-8"]
focus_workspace_9 = ["alt-9", "prefix-9", "prefix-ctrl-9"]
focus_tab_1 = ["ctrl-1", "ctrl-alt-1"]
focus_tab_2 = ["ctrl-2", "ctrl-alt-2"]
focus_tab_3 = ["ctrl-3", "ctrl-alt-3"]
focus_tab_4 = ["ctrl-4", "ctrl-alt-4"]
focus_tab_5 = ["ctrl-5", "ctrl-alt-5"]
focus_tab_6 = ["ctrl-6", "ctrl-alt-6"]
focus_tab_7 = ["ctrl-7", "ctrl-alt-7"]
focus_tab_8 = ["ctrl-8", "ctrl-alt-8"]
focus_tab_9 = ["ctrl-9", "ctrl-alt-9"]
focus_left = ["alt-h", "alt-left", "ctrl-alt-left", "prefix-h", "prefix-left"]
focus_down = ["alt-j", "ctrl-alt-down", "prefix-j", "prefix-down"]
focus_up = ["alt-k", "ctrl-alt-up", "prefix-k", "prefix-up"]
focus_right = ["alt-l", "alt-right", "ctrl-alt-right", "prefix-l", "prefix-right"]
swap_pane_left = "alt-shift-h"
swap_pane_down = "alt-shift-j"
swap_pane_up = "alt-shift-k"
swap_pane_right = "alt-shift-l"
increase_font_size = ["ctrl-=", "ctrl-+"]
decrease_font_size = "ctrl--"
reset_font_size = "ctrl-0"
next_tab = ["ctrl-tab", "ctrl-pagedown", "alt-]", "ctrl-shift-right", "prefix-n"]
previous_tab = ["ctrl-shift-tab", "ctrl-pageup", "alt-[", "ctrl-shift-left", "prefix-p"]
next_workspace = ["ctrl-shift-pagedown", "prefix-)"]
previous_workspace = ["ctrl-shift-pageup", "prefix-("]
next_agent = "alt-down"
previous_agent = "alt-up"
keybindings = ["ctrl-?", "ctrl-shift-/"]
toggle_sidebar = "ctrl-shift-b"
new_workspace = "ctrl-shift-n"
new_tab = ["ctrl-shift-t", "prefix-c"]
workspace_picker = "ctrl-shift-k"
command_palette = "ctrl-shift-p"
settings = "ctrl-,"
split_right = ["ctrl-shift-o", "prefix-|", "prefix-shift-right"]
split_down = ["ctrl-shift-e", "prefix--", "prefix-shift-down"]
close_tab = ["ctrl-shift-w", "prefix-&"]
close_pane = ["ctrl-shift-x", "prefix-x"]
toggle_zoom = ["ctrl-shift-z", "prefix-z"]
rename_tab = ["f2", "prefix-,"]
rename_workspace = ["shift-f2", "prefix-$"]
review_changes = "prefix-g"
open_notification_target = ["prefix-a", "prefix-ctrl-a"]

[pane_keys]
"ctrl-backspace" = "ctrl-w"
"ctrl-left" = "alt-b"
"ctrl-right" = "alt-f"
"shift-enter" = "alt-enter"
