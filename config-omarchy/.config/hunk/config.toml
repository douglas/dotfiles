theme = "custom"
mode = "auto"
vcs = "git"
exclude_untracked = false
line_numbers = true
wrap_lines = false
hunk_headers = true
agent_notes = false

[custom_theme]
base = "graphite"
label = "Omarchy"
background = "#1e1e2e"
panel = "#1e1e2e"
panelAlt = "#45475a"
border = "#585b70"
accent = "#89b4fa"
accentMuted = "#585b70"
text = "#cdd6f4"
muted = "#a6adc8"
addedBg = "#1e1e2e"
removedBg = "#1e1e2e"
contextBg = "#1e1e2e"
addedContentBg = "#45475a"
removedContentBg = "#45475a"
contextContentBg = "#1e1e2e"
addedSignColor = "#a6e3a1"
removedSignColor = "#f38ba8"
lineNumberBg = "#1e1e2e"
lineNumberFg = "#585b70"
selectedHunk = "#585b70"
badgeAdded = "#a6e3a1"
badgeRemoved = "#f38ba8"
badgeNeutral = "#89b4fa"
fileNew = "#a6e3a1"
fileDeleted = "#f38ba8"
fileRenamed = "#f9e2af"
fileModified = "#f5c2e7"
fileUntracked = "#94e2d5"
noteBorder = "#f5c2e7"
noteBackground = "#1e1e2e"
noteTitleBackground = "#45475a"
noteTitleText = "#cdd6f4"

[custom_theme.syntax]
default = "#cdd6f4"
keyword = "#f5c2e7"
string = "#a6e3a1"
comment = "#585b70"
number = "#f9e2af"
function = "#89b4fa"
property = "#94e2d5"
type = "#f5c2e7"
punctuation = "#a6adc8"
