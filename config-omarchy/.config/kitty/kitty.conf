include ~/.local/state/omarchy/current/theme/kitty.conf

# Font
font_family CommitMono Nerd Font
bold_italic_font auto

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0
include ~/.config/kitty/machine.conf

# Keybinds shared with macOS (config package), mirroring herdr-app.
include keys.conf

# Linux only: Super belongs to Hyprland.
map super+enter toggle_fullscreen
map super+1 no_op
map super+2 no_op
map super+3 no_op
map super+4 no_op
map super+5 no_op
map super+6 no_op
map super+7 no_op
map super+8 no_op
map super+9 no_op

# Allow remote access
# allow_remote_control yes

# Copy selected text to the clipboard, like herdr-app.
copy_on_select clipboard

# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Allow cwd lookup from global keybindings
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}
