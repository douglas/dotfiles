# kitty keybinds shared by Linux and macOS, mirroring ~/.config/herdr-app/keys.json.
# Included from kitty.conf; macOS adds its Cmd keys after the include.
# herdr tab = kitty tab, herdr pane = kitty window (split), herdr space = OS window.
# Skipped (no kitty equivalent): space.select/next/prev, agent.*, mods, sidebar, help.

# Text sent to the shell (herdr "terminal" section)
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f search_scrollback
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u
map shift+enter send_text normal \x1b\r
map ctrl+backspace send_text all \x17
map ctrl+left send_text all \x1bb
map ctrl+right send_text all \x1bf

# App
map ctrl+equal change_font_size all +1.0
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0
map ctrl+shift+p command_palette
map ctrl+comma edit_config_file
map ctrl+shift+n new_os_window

# Tabs
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map f2 set_tab_title
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+page_down next_tab
map ctrl+page_up previous_tab
map alt+] next_tab
map alt+[ previous_tab
map ctrl+shift+left previous_tab
map ctrl+shift+right next_tab
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9

# Splits (herdr panes)
enabled_layouts splits,tall,fat,grid,horizontal,vertical
map ctrl+shift+o launch --location=vsplit --cwd=current
map ctrl+shift+e launch --location=hsplit --cwd=current
map ctrl+shift+x close_window
map ctrl+shift+z toggle_layout stack
map ctrl+shift+l next_layout
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+shift+h move_window left
map alt+shift+j move_window down
map alt+shift+k move_window up
map alt+shift+l move_window right
map ctrl+alt+left  neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up    neighboring_window up
map ctrl+alt+down  neighboring_window down

# Ctrl+K leader (herdr "ctrl-k ..." chords)
map ctrl+k>h neighboring_window left
map ctrl+k>j neighboring_window down
map ctrl+k>k neighboring_window up
map ctrl+k>l neighboring_window right
map ctrl+k>left  neighboring_window left
map ctrl+k>right neighboring_window right
map ctrl+k>up    neighboring_window up
map ctrl+k>down  neighboring_window down
map ctrl+k>shift+right launch --location=vsplit --cwd=current
map ctrl+k>shift+down  launch --location=hsplit --cwd=current
map ctrl+k>shift+left  combine : launch --location=vsplit --cwd=current : move_window left
map ctrl+k>shift+up    combine : launch --location=hsplit --cwd=current : move_window up
map ctrl+k>minus launch --location=vsplit --cwd=current
map ctrl+k>equal launch --location=hsplit --cwd=current
map ctrl+k>shift+backslash launch --location=vsplit --cwd=current
map ctrl+k>x close_window
map ctrl+k>z toggle_layout stack
map ctrl+k>c new_tab
map ctrl+k>n next_tab
map ctrl+k>p previous_tab
map ctrl+k>comma set_tab_title
map ctrl+k>shift+7 close_tab
map ctrl+k>ctrl+k send_key ctrl+k
